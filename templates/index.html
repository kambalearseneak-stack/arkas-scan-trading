<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue - ARKAS</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: url('/static/akas.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.88); z-index: -1; backdrop-filter: blur(8px);
        }
        h1 { font-size: 3rem; color: #facc15; letter-spacing: 2px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; max-width: 600px; }
        .btn-start { 
            padding: 15px 40px; background: linear-gradient(135deg, #0ea5e9, #0284c7); 
            color: white; text-decoration: none; border-radius: 8px; font-weight: bold; 
            font-size: 1.2rem; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(14,165,233,0.4); }
    </style>
</head>
<body>
    <h1>ARKAS SCAN AI</h1>
    <p>L'intelligence artificielle au service de votre trading. Analysez vos graphiques MT5 et TradingView en quelques secondes.</p>
    <a href="/login" class="btn-start">Accéder au Terminal</a>
</body>
</html>
