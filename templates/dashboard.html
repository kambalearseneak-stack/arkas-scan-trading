<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Terminal · ARKAS SCAN AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* On force l'image à la racine */
    body { background: url('/akas.jpg') no-repeat center center fixed !important; background-size: cover !important; }
    body::before { background: rgba(7, 17, 31, 0.8) !important; }
    
    /* Transparence des cartes */
    .panel, .topbar {
      background: rgba(16, 29, 45, 0.7) !important;
      backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    /* Effet Scan */
    .preview-wrap { position: relative; overflow: hidden; }
    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: #38bdf8; box-shadow: 0 0 15px 4px rgba(56, 189, 248, 0.8);
      display: none; z-index: 10;
    }
    .scan-line.active { display: block; animation: scanning 2s linear infinite; }
    @keyframes scanning {
      0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; }
    }
  </style>
</head>
<body class="app-body">
  <header class="topbar">
    <a class="brand" href="/dashboard"><span class="brand-icon">A</span><span>ARKAS <b>SCAN AI</b><small>V2 PRO</small></span></a>
    <div class="top-actions"><span class="admin-label">{{ admin_email }}</span>
      <form method="post" action="/logout"><button class="logout-btn" type="submit">Déconnexion</button></form>
    </div>
  </header>

  <main class="shell">
    <nav class="tabs">
      <button class="tab active" data-tab="scanner">Scanner IA</button>
      <button class="tab" data-tab="market">Marché Direct</button>
      <button class="tab" data-tab="history">Historique</button>
      <button class="tab" data-tab="risk">Risk Manager</button>
    </nav>

    <!-- SCANNER CLASSIQUE -->
    <section class="tab-panel active" id="panel-scanner">
      <div class="two-col">
        <div class="panel">
          <h2>Analyse sur capture</h2>
          <label class="upload-zone" for="chartFile">
            <input id="chartFile" type="file" accept="image/*">
            <strong>Importer une capture</strong>
          </label>
          <div class="preview-wrap hidden" id="previewWrap">
            <div class="scan-line" id="scanLine"></div>
            <img id="preview" alt="Aperçu" style="width:100%;">
          </div>
          <button class="button primary full" id="analyzeBtn" type="button">Lancer l'analyse</button>
        </div>
        <div class="panel">
          <h2>Résultat</h2>
          <div id="analysisResult" class="hidden"></div>
          <div id="errorState" class="notice error hidden"></div>
        </div>
      </div>
    </section>

    <!-- TRADINGVIEW DIRECT -->
    <section class="tab-panel" id="panel-market">
      <div class="panel">
        <h2>Graphique en direct (TradingView)</h2>
        <div id="tradingview_chart" style="height: 450px; margin-bottom: 15px; border-radius: 8px; overflow: hidden;"></div>
        <button class="button primary full" id="scanTvBtn" type="button">Scanner ce graphique</button>
      </div>
    </section>

    <!-- HISTORIQUE ET RISQUE (Identiques) -->
    <section class="tab-panel" id="panel-history">
      <div class="panel"><h2>Historique</h2><div id="historyList"></div></div>
    </section>
    <section class="tab-panel" id="panel-risk">
        <div class="panel"><h2>Risk Manager</h2><p>Fonctionnalité intacte.</p></div>
    </section>
  </main>

  <!-- Script TradingView -->
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    new TradingView.widget({
      "container_id": "tradingview_chart", "autosize": true, "symbol": "FX:XAUUSD",
      "interval": "60", "timezone": "Etc/UTC", "theme": "dark", "style": "1",
      "locale": "fr", "enable_publishing": false, "allow_symbol_change": true, "save_image": true
    });
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
