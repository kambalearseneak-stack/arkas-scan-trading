<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion · ARKAS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    body {
      margin: 0; font-family: 'Space Grotesk', sans-serif;
      background: url('/static/akas.jpg') no-repeat center center fixed; background-size: cover;
      color: white; display: flex; justify-content: center; align-items: center; height: 100vh;
    }
    body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 17, 31, 0.9); z-index: -1; }
    .login-box {
      background: rgba(16, 29, 45, 0.95); padding: 40px; border-radius: 20px;
      border: 1px solid #2b435a; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    h2 { color: #f2c94c; text-align: center; margin-bottom: 20px; }
    label { display: block; color: #91a4ba; font-size: 0.85rem; margin: 15px 0 5px; }
    input { width: 100%; padding: 12px; background: #081523; border: 1px solid #2b4055; color: white; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin-top: 20px; background: linear-gradient(135deg, #5bd0f5, #0d9fd8); border: none; color: #061522; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .error { background: #4b202a; color: #ffd9de; padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Connexion</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="error">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="/login">
      <label>Adresse email</label>
      <input type="email" name="email" required placeholder="kambalearseneak@gmail.com">
      <label>Mot de passe</label>
      <input type="password" name="password" required placeholder="••••••••">
      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
