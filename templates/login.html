<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion · ARKAS SCAN AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing">
  <main class="login-card">
    <a class="back-link" href="{{ url_for('home') }}">← Accueil</a>
    <div class="brand-mark small">A</div>
    <div class="eyebrow">ESPACE PRIVÉ ADMINISTRATEUR</div>
    <h1>Connexion</h1>
    <p class="muted">Identifie-toi pour accéder au terminal ARKAS.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Adresse email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="admin@exemple.com">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Ton mot de passe">
      <button class="button primary full" type="submit">Se connecter</button>
    </form>
    <p class="tiny muted">Accès réservé à l'administrateur autorisé.</p>
  </main>
</body>
</html>
