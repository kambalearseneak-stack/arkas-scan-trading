<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKAS Scan AI - Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-dark: rgba(15, 23, 42, 0.85);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #0ea5e9;
            --accent: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --buy: #10b981;
            --sell: #ef4444;
            --wait: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            /* Syntaxe Flask correcte pour Render */
            background: url("{{ url_for('static', filename='akas.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        /* Voile sombre pour faire ressortir l'interface */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85);
            z-index: -1;
            backdrop-filter: blur(5px);
        }

        .main-container {
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-title { text-align: center; margin-bottom: 25px; }
        .logo-title h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #facc15, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-title p { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; letter-spacing: 1px; }

        /* Onglets */
        .tab-buttons {
            display: flex; margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px; padding: 5px;
        }
        .tab-btn {
            flex: 1; padding: 10px; background: transparent; border: none;
            color: var(--text-muted); font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s; border-radius: 8px;
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }

        #scannerTabBtn { display: none; }

        .panel-section { display: none; animation: fadeIn 0.4s ease; }
        .panel-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); color: white;
            border-radius: 8px; font-size: 1rem; transition: 0.3s; font-family: 'JetBrains Mono', monospace;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.5); }

        .submit-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white; border: none; border-radius: 8px; font-weight: 800;
            font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .submit-btn:hover { background: linear-gradient(135deg, #0ea5e9, #38bdf8); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3); }
        
        .btn-verify { background: linear-gradient(135deg, #6d28d9, #8b5cf6); margin-top: 12px; }
        .btn-verify:hover { background: linear-gradient(135deg, #8b5cf6, #a78bfa); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3); }

        /* Panneau stratégie */
        .strategy-info {
            background: rgba(14, 165, 233, 0.1); border-left: 4px solid var(--primary);
            padding: 15px 20px; border-radius: 0 8px 8px 0; margin-bottom: 25px;
            font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;
        }
        .strategy-info strong { color: var(--accent); display: block; margin-bottom: 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .strategy-info ul { margin-left: 20px; margin-top: 8px; }

        /* Zone Image & Scan */
        .image-preview-container {
            position: relative; display: none; margin: 20px 0;
            border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .image-preview-container img { width: 100%; display: block; }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            box-shadow: 0 0 20px 5px rgba(56, 189, 248, 0.5);
            animation: scanning 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes scanning {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Résultats */
        #result { margin-top: 25px; display: none; }
        
        .result-card {
            background: rgba(0,0,0,0.4); border-radius: 12px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.1); font-family: 'JetBrains Mono', monospace;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .signal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .signal-badge {
            padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px;
        }
        .bg-buy { background: rgba(16, 185, 129, 0.2); color: var(--buy); border: 1px solid var(--buy); }
        .bg-sell { background: rgba(239, 68, 68, 0.2); color: var(--sell); border: 1px solid var(--sell); }
        .bg-wait { background: rgba(245, 158, 11, 0.2); color: var(--wait); border: 1px solid var(--wait); }
        
        .score-box { text-align: right; }
        .score-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); }

        .data-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;
        }
        .data-item {
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px;
            border-left: 2px solid var(--primary);
        }
        .data-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .data-value { font-size: 1.1rem; font-weight: bold; }

        .reason-box {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;
            font-size: 0.9rem; line-height: 1.5; margin-top: 15px; border-left: 3px solid var(--accent);
            white-space: pre-wrap;
        }

        .quote-footer { text-align: center; margin-top: 30px; color: #475569; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-title">
            <h1>ARKAS Scan AI</h1>
            <p>Terminal d'analyse institutionnelle</p>
        </div>

        <div class="tab-buttons">
            <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login', this)">Connexion</button>
            <button id="registerTabBtn" class="tab-btn" onclick="switchTab('register', this)">Inscription</button>
            <button id="scannerTabBtn" class="tab-btn" onclick="switchTab('scanner', this)">Scanner MT5</button>
        </div>

        <!-- LOGIN -->
        <div id="loginSection" class="panel-section active">
            <form onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Identifiant</label>
                    <input type="text" required placeholder="arsene@arkas.com">
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Accéder au Terminal</button>
            </form>
        </div>

        <!-- REGISTER -->
        <div id="registerSection" class="panel-section">
            <form onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Nom complet</label>
                    <input type="text" required placeholder="Arsène Kasika">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" required placeholder="votre_email@domaine.com">
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Créer un compte</button>
            </form>
        </div>

        <!-- SCANNER -->
        <div id="scannerSection" class="panel-section">
            
            <div class="strategy-info">
                <strong>Moteur SMC / ICT / Price Action</strong>
                Compatible : MT5, TradingView, Deriv.<br>
                <ul>
                    <li>Structure de marché (BOS, CHoCH)</li>
                    <li>Zones de liquidité & Order Blocks</li>
                    <li>Fair Value Gaps & Confluence (OTE/POC)</li>
                </ul>
            </div>

            <form id="uploadForm">
                <div class="input-group">
                    <label>Importer un graphique</label>
                    <input type="file" id="fileInput" accept="image/*" required style="padding: 10px;">
                </div>
                
                <div id="imageContainer" class="image-preview-container">
                    <img id="previewImage" src="" alt="Aperçu">
                    <div id="scanEffect" class="scan-line" style="display: none;"></div>
                </div>

                <button type="button" class="submit-btn" onclick="processImage('scan')">Générer un Signal</button>
                <button type="button" class="submit-btn btn-verify" onclick="processImage('audit')">Auditer une Analyse</button>
            </form>
            
            <div id="result"></div>
        </div>

        <div class="quote-footer">ARKAS Scan Trading AI &copy; 2026 - Propulsé par Gemini</div>
    </div>

    <script>
        // Navigation
        function switchTab(tab, btn) {
            document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + 'Section').classList.add('active');
            btn.classList.add('active');
        }

        function handleAuth(e) {
            e.preventDefault();
            const scannerBtn = document.getElementById('scannerTabBtn');
            scannerBtn.style.display = 'block';
            switchTab('scanner', scannerBtn);
        }

        // Gestion de l'image
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('imageContainer').style.display = 'block';
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // Envoi à l'API Flask (Render)
        async function processImage(mode) {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            const scanEffect = document.getElementById('scanEffect');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Veuillez sélectionner une image.");
                return;
            }

            // Reset et lancement de l'animation
            resultDiv.style.display = 'none';
            resultDiv.innerHTML = '';
            scanEffect.style.display = 'block';

            const file = fileInput.files[0];
            
            // Préparation des données pour Flask (FormData et non JSON)
            const formData = new FormData();
            formData.append('file', file);
            formData.append('mode', mode); // 'scan' ou 'audit'

            try {
                // Appel à votre route Flask /analyze
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                scanEffect.style.display = 'none';
                
                if (response.ok) {
                    // Affichage du résultat (si votre backend renvoie du JSON)
                    if (typeof data.analysis === 'object') {
                        renderResult(data.analysis);
                    } else {
                        // Fallback si le backend renvoie du texte brut
                        resultDiv.style.display = 'block';
                        resultDiv.innerHTML = `<div class="result-card"><div class="reason-box">${data.analysis}</div></div>`;
                    }
                } else {
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `<div class="result-card" style="border-color: #ef4444; color: #ef4444;">Erreur API : ${data.error || 'Inconnue'}</div>`;
                }
            } catch (err) {
                scanEffect.style.display = 'none';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<div class="result-card" style="border-color: #ef4444; color: #ef4444;">Erreur de connexion au serveur Flask.</div>`;
            }
        }

        // Affichage esthétique du JSON
        function renderResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            let badgeClass = 'bg-wait';
            if (data.signal && data.signal.includes('BUY')) badgeClass = 'bg-buy';
            if (data.signal && data.signal.includes('SELL')) badgeClass = 'bg-sell';

            const fmt = (val) => val ? Number(val).toFixed(2) : '---';

            let html = `
                <div class="result-card">
                    <div class="signal-header">
                        <div>
                            <div class="data-label">Signal Détecté</div>
                            <div class="signal-badge ${badgeClass}">${data.signal || 'WAIT'}</div>
                        </div>
                        <div class="score-box">
                            <div class="data-label">Score ARKAS</div>
                            <div class="score-value">${data.arkas_score || 0}/100</div>
                        </div>
                    </div>

                    <div class="data-grid">
                        <div class="data-item">
                            <div class="data-label">Entrée</div>
                            <div class="data-value">${fmt(data.entry)}</div>
                        </div>
                        <div class="data-item">
                            <div class="data-label">Stop Loss</div>
                            <div class="data-value" style="color: var(--sell);">${fmt(data.sl)}</div>
                        </div>
                        <div class="data-item">
                            <div class="data-label">Take Profit 1</div>
                            <div class="data-value" style="color: var(--buy);">${fmt(data.tp1)}</div>
                        </div>
                        <div class="data-item">
                            <div class="data-label">Take Profit 2</div>
                            <div class="data-value" style="color: var(--buy);">${fmt(data.tp2)}</div>
                        </div>
                    </div>

                    <div class="reason-box">
                        <strong>Analyse :</strong><br>
                        ${data.reason || 'Aucune raison fournie.'}
                    </div>
            `;

            if (data.audit) {
                html += `
                    <div class="reason-box" style="border-left-color: #8b5cf6; margin-top: 20px;">
                        <strong>Verdict de l'Audit : ${data.audit.status}</strong><br>
                        ${data.audit.verdict}
                    </div>
                `;
            }

            html += `</div>`;
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
