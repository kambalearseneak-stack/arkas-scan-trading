<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARKAS SCAN AI V2</title>
  <style>
    /* Design intégré directement ici pour être sûr qu'il s'affiche */
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      /* VOTRE IMAGE EN ARRIÈRE PLAN */
      background: url('/static/akas.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    /* Voile sombre pour que le texte soit lisible */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 17, 31, 0.85); z-index: -1; backdrop-filter: blur(5px);
    }
    .card {
      background: rgba(16, 29, 45, 0.95);
      padding: 40px; border-radius: 20px; text-align: center;
      border: 1px solid #2b435a; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      max-width: 500px;
    }
    h1 { color: #f2c94c; font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; }
    p { color: #91a4ba; margin-bottom: 30px; }
    .btn {
      display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, #5bd0f5, #0d9fd8);
      color: #061522; text-decoration: none; font-weight: bold; border-radius: 10px; transition: 0.3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(14,165,233,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <h1>ARKAS SCAN AI</h1>
    <p>SMC · ICT · PRICE ACTION · RISK MANAGEMENT</p>
    <a href="/login" class="btn">Accéder au terminal →</a>
  </div>
</body>
</html>
